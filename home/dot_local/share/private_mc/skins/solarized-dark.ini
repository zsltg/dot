# Solarized dark skin for Midnight Commander.
# The skin uses the 16 ANSI color names. The terminal palette must be
# Solarized (see alacritty.toml). The ANSI names map to Solarized as follows:
#   gray = base03       black = base02      brightgreen = base01
#   yellow = base00     brightblue = base0  brightcyan = base1
#   lightgray = base2   white = base3
#   brown = yellow      brightred = orange  red = red
#   magenta = magenta   brightmagenta = violet
#   blue = blue         cyan = cyan         green = green
# "default" is the terminal background (base03).

[skin]
    description = Solarized dark

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = brightblue;default
    selected = gray;blue
    marked = brown;default;bold
    markselect = gray;brown
    gauge = gray;blue
    input = brightcyan;gray
    inputunchanged = brightblue;gray
    inputmark = gray;cyan
    disabled = brightgreen;black
    reverse = gray;brightblue
    commandlinemark = gray;brightblue
    header = brown;default
    inputhistory =
    commandhistory =
    shadow = brightgreen;black

[dialog]
    _default_ = brightblue;black
    dfocus = gray;blue
    dhotnormal = brown;black
    dhotfocus = white;blue
    dtitle = brightcyan;black;bold

[error]
    _default_ = white;red
    errdfocus = red;lightgray
    errdhotnormal = black;red
    errdhotfocus = brightred;lightgray
    errdtitle = white;red;bold

[filehighlight]
    directory = blue;
    executable = green;
    symlink = cyan;
    hardlink =
    stalelink = red;
    device = brightred;
    special = brightred;
    core = red;
    temp = brightgreen;
    archive = brightmagenta;
    doc = brown;
    source = brightcyan;
    media = magenta;
    graph = magenta;
    database = brightred;

[menu]
    _default_ = brightblue;black
    menusel = gray;blue
    menuhot = brown;black
    menuhotsel = white;blue
    menuinactive = brightgreen;black

[popupmenu]
    _default_ = brightblue;black
    menusel = gray;blue
    menutitle = brightcyan;black

[buttonbar]
    hotkey = brown;default
    button = brightblue;black

[statusbar]
    _default_ = brightblue;black

[help]
    _default_ = brightblue;black
    helpitalic = green;black
    helpbold = brightcyan;black
    helplink = blue;black
    helpslink = gray;blue
    helptitle = brightcyan;black;bold

[editor]
    _default_ = brightblue;default
    editbold = brown;default
    editmarked = brightcyan;black
    editwhitespace = brightgreen;default
    editlinestate = brightgreen;black
    bookmark = white;red
    bookmarkfound = gray;green
    editrightmargin = brightgreen;black
    editframeactive = brightcyan;
    editframedrag = green;

[viewer]
    _default_ = brightblue;default
    viewbold = brightcyan;default;bold
    viewunderline = brown;default
    viewselected = gray;brown

[diffviewer]
    added = green;black
    changedline = blue;black
    changednew = brightred;black
    changed = brown;black
    removed = red;black
    error = white;red

[widget-panel]
    sort-up-char = '
    sort-down-char = .
    filename-scroll-left-char = {
    filename-scroll-right-char = }

[widget-editor]
    window-state-char = *
    window-close-char = X
