# Selenized skin for Midnight Commander (Solarized background).
# The skin uses the 16 ANSI color names. The terminal palette must be the selenized
# palette in .chezmoidata/palette.yaml. The ANSI names map to the palette as follows:
#   black = bg_1        gray = bg_2          lightgray = dim_0    white = fg_1
#   red, green, cyan, blue, magenta = the accents, brown = yellow
#   brightred .. brightcyan, yellow = the bright accents
# "default" is the terminal background (bg_0) or foreground (fg_0).

[skin]
    description = Selenized (Solarized background)

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = default;default
    selected = black;blue
    marked = brown;default;bold
    markselect = black;brown
    gauge = black;blue
    input = white;gray
    inputunchanged = default;gray
    inputmark = black;cyan
    disabled = lightgray;black
    reverse = black;white
    commandlinemark = black;white
    header = brown;default
    inputhistory =
    commandhistory =
    shadow = lightgray;black

[dialog]
    _default_ = default;black
    dfocus = black;blue
    dhotnormal = brown;black
    dhotfocus = white;blue
    dtitle = white;black;bold

[error]
    _default_ = white;red
    errdfocus = red;white
    errdhotnormal = black;red
    errdhotfocus = brightred;white
    errdtitle = white;red;bold

[filehighlight]
    directory = blue;
    executable = green;
    symlink = cyan;
    hardlink =
    stalelink = red;
    device = brightred;
    special = brightred;
    core = red;
    temp = lightgray;
    archive = brightmagenta;
    doc = brown;
    source = white;
    media = magenta;
    graph = magenta;
    database = brightred;

[menu]
    _default_ = default;black
    menusel = black;blue
    menuhot = brown;black
    menuhotsel = white;blue
    menuinactive = lightgray;black

[popupmenu]
    _default_ = default;black
    menusel = black;blue
    menutitle = white;black

[buttonbar]
    hotkey = brown;default
    button = default;black

[statusbar]
    _default_ = default;black

[help]
    _default_ = default;black
    helpitalic = green;black
    helpbold = white;black
    helplink = blue;black
    helpslink = black;blue
    helptitle = white;black;bold

[editor]
    _default_ = default;default
    editbold = brown;default
    editmarked = white;black
    editwhitespace = lightgray;default
    editlinestate = lightgray;black
    bookmark = white;red
    bookmarkfound = black;green
    editrightmargin = lightgray;black
    editframeactive = white;
    editframedrag = green;

[viewer]
    _default_ = default;default
    viewbold = white;default;bold
    viewunderline = brown;default
    viewselected = black;brown

[diffviewer]
    added = green;black
    changedline = blue;black
    changednew = brightred;black
    changed = brown;black
    removed = red;black
    error = white;red

[widget-panel]
    sort-up-char = '
    sort-down-char = .
    filename-scroll-left-char = {
    filename-scroll-right-char = }

[widget-editor]
    window-state-char = *
    window-close-char = X
